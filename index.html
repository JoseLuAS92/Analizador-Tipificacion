<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analizador de Tipificación</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fa;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003366;
}

textarea{
    width:100%;
    height:250px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    resize:vertical;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#0078D4;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#005EA6;
}

.resultado{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

.card{
    border-left:5px solid #0078D4;
    background:#F8F9FB;
    padding:15px;
    margin-bottom:15px;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>🔎 Analizador de Tipificación</h1>

<textarea
id="descripcion"
placeholder="Pegue aquí la descripción completa del caso...">
</textarea>

<br><br>

<button onclick="analizar()">
Analizar Caso
</button>

<div id="resultado" class="resultado">
Esperando análisis...
</div>

<script.jsscript>

</div>

</body>
</html>
